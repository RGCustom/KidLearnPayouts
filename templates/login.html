{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="card login">
  <h1>Вход</h1>
  {% if no_users %}<div class="flash err">Аккаунтов ещё нет: задайте ADMIN_PASSWORD в настройках контейнера и перезапустите его.</div>{% endif %}
  <p class="muted">Баланс, история и статистика видны только вошедшим.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="text" name="login" value="{{ login_value }}" placeholder="Логин" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" autofocus required>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" maxlength="256" required>
    <label class="check"><input type="checkbox" name="remember" value="1"><span>Запомнить меня на {{ remember_days }} дн.</span></label>
    <button class="btn primary" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
