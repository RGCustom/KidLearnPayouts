{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="card login">
  <h1>Вход для правок</h1>
  <p class="muted">Просмотр и статистика открыты без пароля. Записи, выплаты и удаление — только по паролю.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
    <button class="btn primary" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
